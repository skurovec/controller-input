[package]
name = "minecraft-input"
version = "0.1.0"
edition = "2021"
description = "Controller to keyboard/mouse mapper for Minecraft"
authors = ["You"]
license = "MIT"

[lib]
name = "minecraft_input_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "minecraft-input"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
gilrs = "0.11"
enigo = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
