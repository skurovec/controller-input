[package]
name = "controller-input"
version = "0.1.0"
edition = "2021"
description = "Controller to keyboard/mouse mapper"
authors = ["Jan Skurovec"]
license = "MIT"
repository = "https://github.com/skurovec/controller-input"

[lib]
name = "controller_input_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "controller-input"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["windows-xinput"]
windows-xinput = ["gilrs/xinput"]
windows-wgi = ["gilrs/wgi"]

[dependencies]
tauri = { version = "2", features = [] }
gilrs = { version = "0.11", default-features = false }
enigo = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
