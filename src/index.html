<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controller Input</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Controller Input</h1>
            <p class="subtitle">Controller to Keyboard/Mouse Mapper</p>
        </header>

        <section class="status-section">
            <div class="status-card">
                <div class="status-indicator" id="controllerIndicator"></div>
                <div class="status-info">
                    <span class="status-label">Controller</span>
                    <span class="status-value" id="controllerStatus">Checking...</span>
                </div>
            </div>

            <div class="status-card">
                <div class="status-indicator" id="mappingIndicator"></div>
                <div class="status-info">
                    <span class="status-label">Mapping</span>
                    <span class="status-value" id="mappingStatus">Inactive</span>
                </div>
            </div>
        </section>

        <section class="controls-section">
            <button class="toggle-btn" id="toggleBtn" disabled>
                <span class="btn-text">Start Mapping</span>
            </button>
        </section>

        <section class="settings-section">
            <h2>Settings</h2>

            <div class="setting-item">
                <label for="deadzone">Deadzone</label>
                <div class="slider-container">
                    <input type="range" id="deadzone" min="0" max="0.5" step="0.01" value="0.15">
                    <span class="slider-value" id="deadzoneValue">0.15</span>
                </div>
            </div>

            <div class="setting-item">
                <label for="sensitivity">Mouse Sensitivity</label>
                <div class="slider-container">
                    <input type="range" id="sensitivity" min="0.5" max="10" step="0.1" value="2.5">
                    <span class="slider-value" id="sensitivityValue">2.5</span>
                </div>
            </div>

            <div class="setting-item">
                <label for="threshold">Stick Threshold</label>
                <div class="slider-container">
                    <input type="range" id="threshold" min="0.1" max="0.9" step="0.05" value="0.5">
                    <span class="slider-value" id="thresholdValue">0.5</span>
                </div>
            </div>

            <button class="reset-btn" id="resetBtn">Reset to Defaults</button>
        </section>

        <section class="mappings-section">
            <h2>Button Mapping</h2>
            <div class="mappings-static">
                <div class="mapping-item">
                    <span class="mapping-input">Left Stick</span>
                    <span class="mapping-arrow">→</span>
                    <span class="mapping-output">WASD</span>
                </div>
                <div class="mapping-item">
                    <span class="mapping-input">Right Stick</span>
                    <span class="mapping-arrow">→</span>
                    <span class="mapping-output">Mouse</span>
                </div>
            </div>
            <div class="button-mappings-grid" id="buttonMappingsGrid"></div>
        </section>
    </div>

    <script src="main.js"></script>
</body>
</html>
